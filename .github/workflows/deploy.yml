name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: mon-site-web
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-push:
    name: CI - Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Push de l'image vers Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: CD - Deploy
    needs: build-and-push
    runs-on: [self-hosted, runner-isi, ubuntu-latest]

    steps:
      - name: Pull de la dernière image depuis Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Stopper le conteneur existant (si présent)
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true

      - name: Supprimer l'ancien conteneur
        run: |
          docker rm ${{ env.IMAGE_NAME }} || true

      - name: Lancer le nouveau conteneur
        run: |
          docker run -d --name ${{ env.IMAGE_NAME }} -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
